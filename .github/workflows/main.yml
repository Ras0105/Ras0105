name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ras0105
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2326a641
            dist/github-contribution-grid-snake-dark.svg?color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353&color_snake=%2339d353

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}